<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Pirámide de Cefa & La Seta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- PANTALLA PRINCIPAL: BIFURCACIÓN -->
    <div id="main-menu" class="screen active">
        <h1>CEFA PARTY APP</h1>
        <div class="menu-buttons">
            <button onclick="showScreen('piramide-login')" class="btn-piramide">👁️ LA PIRÁMIDE (Multijugador)</button>
            <button onclick="iniciarSeta()" class="btn-seta">🍄 LA SETA (1 Móvil)</button>
        </div>
    </div>

    <!-- MODO: LA SETA EXPRESS -->
    <div id="seta-screen" class="screen">
        <div class="seta-header">
            <h2>🍄 LA SETA</h2>
            <p id="seta-counter">Cartas restantes: 41</p>
        </div>
        <div class="seta-board">
            <div id="seta-deck" onclick="sacarCartaSeta()">
                <div class="card-back">TAP PARA ROBAR</div>
            </div>
            <div id="seta-chivato" class="chivato hidden">
                <h3 id="seta-card-title"></h3>
                <p id="seta-card-rule"></p>
            </div>
        </div>
        <button id="btn-next-seta" class="btn-next hidden" onclick="prepararSiguienteSeta()">Siguiente Carta</button>
    </div>

    <!-- LOBBY: LA PIRÁMIDE -->
    <div id="piramide-login" class="screen">
        <h2>👁️ ENTRAR A LA PIRÁMIDE</h2>
        <input type="text" id="username" placeholder="Tu Apodo (Ej: Pablitou)">
        <input type="text" id="roomCode" placeholder="Código de Sala (Ej: FIESTA)">
        <button onclick="joinPiramide()" class="btn-piramide">Entrar a la Sala</button>
        <button onclick="showScreen('main-menu')" class="btn-back">Volver</button>
    </div>

    <!-- JUEGO: LA PIRÁMIDE (Mobile Layout) -->
    <div id="piramide-game" class="screen">
        <div id="reglas-activas-banner">Reglas Activas: Ninguna</div>
        
        <!-- Centro: Pirámide y Rivales -->
        <div class="piramide-center">
            <h3>Sala: <span id="display-room"></span></h3>
            <div id="players-list" class="players-scroll"></div>
            <!-- Aquí se inyectará la pirámide 3D -->
            <div id="mesa-central">Esperando al Máster...</div>
        </div>

        <!-- Mano Inferior (Fija) -->
        <div class="hand-container">
            <div class="hand-header">Tu Inventario (<span id="mis-tragos">0</span> Tragos)</div>
            <div id="my-cards" class="cards-row"></div>
        </div>

        <!-- Botón Flotante del Máster -->
        <div id="master-btn" class="hidden" onclick="toggleMasterPanel()">👑</div>
        
        <!-- Panel del Máster -->
        <div id="master-panel" class="hidden">
            <h4>Panel de Control</h4>
            <button onclick="masterNextPhase()" id="btn-master-action">Destapar Cartas</button>
            <button onclick="castigoDivino()">Castigo Divino ⚡</button>
            <button onclick="undoAction()" class="btn-danger">Deshacer Última</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
